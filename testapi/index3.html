<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WVP 通道播放与云台控制</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.2.0/crypto-js.min.js"></script>
  <!-- Jessibuca 播放器（拷贝自 web/public/static/js/jessibuca），必须与本页同源，Worker/wasm 才能加载。 -->
  <script src="static/js/jessibuca/jessibuca.js"></script>
  <link rel="stylesheet" href="index3-common.css">
  <link rel="stylesheet" href="components/device-tree/device-tree.css">
  <link rel="stylesheet" href="components/video-grid/video-grid.css">
  <link rel="stylesheet" href="components/detail-panel/detail-panel.css">
  <link rel="stylesheet" href="components/record-panel/record-panel.css">
</head>
<body>
  <header class="topbar">
    <h1>WVP 通道播放与云台控制</h1>
    <button id="refreshButton" class="primary" type="button" disabled>刷新树</button>
    <button id="expandButton" type="button" disabled>展开全部</button>
    <button id="collapseButton" type="button" disabled>收起全部</button>
    <span class="api-text">API：<code id="apiBaseText"></code>　播放：<code>/api/common/channel/play</code>　控制：<code>/api/common/channel/front-end/*</code></span>
    <span id="status" class="status">准备登录</span>
  </header>

  <div class="workspace">
    <!-- 左：列表 -->
    <device-tree-panel class="tree-panel"></device-tree-panel>

    <!-- 中：宫格播放器 -->
    <section class="grid-panel" aria-label="多路视频宫格">
      <video-grid-panel></video-grid-panel>

      <record-panel></record-panel>

      <detail-panel></detail-panel>
    </section>
  </div>
  <script type="module" src="index3-app.js"></script>
</body>
</html>
